<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js 3D 立方体</title>
    <style>
        /* 重置默认样式，确保全屏显示 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 设置 body 和 html 高度为 100%，隐藏滚动条 */
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }

        /* 容器样式 */
        #container {
            width: 100%;
            height: 100%;
        }

        /* 标题样式 */
        .title {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }

        /* 提示信息样式 */
        .hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaaaaa;
            font-family: 'Arial', sans-serif;
            font-size: 14px;
            text-align: center;
            pointer-events: none;
            z-index: 10;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <!-- 标题 -->
    <div class="title">Three.js 交互式 3D 立方体</div>
    
    <!-- 提示信息 -->
    <div class="hint">
        🖱️ 移动鼠标：立方体跟随倾斜、移动和缩放<br>
        🖱️ 按住拖拽：加速旋转立方体
    </div>
    
    <!-- 3D 场景容器 -->
    <div id="container"></div>

    <!-- 引入 Three.js (通过 CDN) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- 主脚本 -->
    <script type="module">
        // 导入 Three.js 核心模块
        import * as THREE from 'three';

        // ============================================
        // 1. 创建场景 (Scene)
        // ============================================
        // 场景是所有 3D 对象的容器，相当于一个虚拟的 3D 世界
        const scene = new THREE.Scene();
        // 设置场景背景色为深灰色
        scene.background = new THREE.Color(0x222222);

        // ============================================
        // 2. 创建相机 (PerspectiveCamera)
        // ============================================
        // 透视相机模拟人眼的视觉效果，具有近大远小的透视感
        // 参数说明：
        //   - 75: 视野角度 (FOV)，单位为度
        //   - window.innerWidth / window.innerHeight: 宽高比
        //   - 0.1: 近裁剪面，距离相机小于此值的物体不会被渲染
        //   - 1000: 远裁剪面，距离相机大于此值的物体不会被渲染
        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        // 设置相机位置，z 轴正方向朝向屏幕外
        camera.position.set(0, 0, 5);

        // ============================================
        // 3. 创建渲染器 (WebGLRenderer)
        // ============================================
        // WebGLRenderer 使用 WebGL 技术将 3D 场景渲染到 HTML canvas 元素上
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true  // 开启抗锯齿，使边缘更平滑
        });
        // 设置渲染器大小为窗口大小
        renderer.setSize(window.innerWidth, window.innerHeight);
        // 开启阴影映射功能
        renderer.shadowMap.enabled = true;
        // 设置阴影类型为 PCFSoftShadowMap（百分比过滤软阴影）
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        // 将渲染器的 canvas 元素添加到页面容器中
        document.getElementById('container').appendChild(renderer.domElement);

        // ============================================
        // 4. 创建立方体 (BoxGeometry)
        // ============================================
        // 创建几何体：BoxGeometry 是一个立方体几何体
        // 参数：宽度、高度、深度，单位均为单位长度
        const geometry = new THREE.BoxGeometry(2, 2, 2);

        // 创建材质：MeshStandardMaterial 是一种支持光照的标准材质
        const material = new THREE.MeshStandardMaterial({
            color: 0x4CAF50,      // 材质颜色（绿色）
            roughness: 0.3,       // 粗糙度（0-1），越小越光滑
            metalness: 0.1        // 金属度（0-1），越大越像金属
        });

        // 创建网格：将几何体和材质组合成一个可渲染的 3D 对象
        const cube = new THREE.Mesh(geometry, material);
        // 开启立方体的阴影投射功能
        cube.castShadow = true;
        // 开启立方体的阴影接收功能
        cube.receiveShadow = true;
        // 将立方体添加到场景中
        scene.add(cube);

        // ============================================
        // 5. 创建光源
        // ============================================
        
        // 5.1 环境光 (AmbientLight)
        // 环境光是一种均匀的全局光照，不会产生阴影，用于提供基础照明
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        // 强度为 0.4，表示较柔和的环境光
        scene.add(ambientLight);

        // 5.2 方向光 (DirectionalLight)
        // 方向光模拟太阳光等平行光源，可以产生阴影
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        // 设置光源位置
        directionalLight.position.set(5, 10, 7);
        // 开启阴影投射
        directionalLight.castShadow = true;
        
        // 配置阴影参数
        directionalLight.shadow.mapSize.width = 2048;   // 阴影贴图宽度
        directionalLight.shadow.mapSize.height = 2048;  // 阴影贴图高度
        directionalLight.shadow.camera.near = 0.5;      // 阴影相机近裁剪面
        directionalLight.shadow.camera.far = 50;        // 阴影相机远裁剪面
        directionalLight.shadow.bias = -0.001;          // 阴影偏移，防止阴影失真
        
        scene.add(directionalLight);

        // 5.3 添加一个辅助光源（点光源），增加立体感
        const pointLight = new THREE.PointLight(0x4080ff, 0.5);
        pointLight.position.set(-5, 5, -5);
        scene.add(pointLight);

        // ============================================
        // 6. 创建地面（用于接收阴影）
        // ============================================
        // 创建一个平面几何体作为地面
        const planeGeometry = new THREE.PlaneGeometry(20, 20);
        // 创建地面材质
        const planeMaterial = new THREE.MeshStandardMaterial({
            color: 0x333333,
            roughness: 0.8,
            metalness: 0.2
        });
        // 创建地面网格
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        // 旋转地面使其水平（平面默认是垂直的，需要绕 X 轴旋转 -90 度）
        plane.rotation.x = -Math.PI / 2;
        // 将地面放置在立方体下方
        plane.position.y = -2;
        // 开启地面的阴影接收功能
        plane.receiveShadow = true;
        // 将地面添加到场景
        scene.add(plane);

        // ============================================
        // 7. 鼠标交互变量（必须在动画循环之前声明）
        // ============================================
        // 鼠标位置变量（目标值和当前值，用于平滑过渡）
        let targetMouseX = 0;
        let targetMouseY = 0;
        let currentMouseX = 0;
        let currentMouseY = 0;
        
        // 鼠标是否按下
        let isMouseDown = false;
        // 用于拖拽旋转
        let previousMouseX = 0;
        let previousMouseY = 0;
        let rotationVelocityX = 0.01;
        let rotationVelocityY = 0.01;

        // ============================================
        // 8. 动画循环 (Animation Loop)
        // ============================================
        // 动画函数，使用 requestAnimationFrame 实现平滑动画
        function animate() {
            // 请求下一帧动画，形成循环
            requestAnimationFrame(animate);

            // 平滑过渡鼠标位置（使用线性插值 LERP）
            currentMouseX += (targetMouseX - currentMouseX) * 0.05;
            currentMouseY += (targetMouseY - currentMouseY) * 0.05;

            // 如果没有按下鼠标，根据鼠标位置添加倾斜效果
            if (!isMouseDown) {
                // 立方体基础自转
                cube.rotation.x += 0.01;
                cube.rotation.y += 0.01;
                
                // 根据鼠标位置添加额外的倾斜（限制最大倾斜角度）
                cube.rotation.x += currentMouseY * 0.03;
                cube.rotation.y += currentMouseX * 0.03;
                
                // 立方体跟随鼠标位置轻微移动（视差效果，限制范围）
                cube.position.x = currentMouseX * 0.8;
                cube.position.y = currentMouseY * 0.5;
                
                // 根据鼠标距离中心的距离调整缩放（限制缩放范围）
                const distance = Math.sqrt(currentMouseX * currentMouseX + currentMouseY * currentMouseY);
                const scale = 1 + distance * 0.15;
                cube.scale.set(scale, scale, scale);
            } else {
                // 鼠标按下时，使用拖拽产生的旋转速度
                cube.rotation.x += rotationVelocityX;
                cube.rotation.y += rotationVelocityY;
                
                // 逐渐减速
                rotationVelocityX *= 0.95;
                rotationVelocityY *= 0.95;
                
                // 最小速度限制，保持一定旋转
                if (Math.abs(rotationVelocityX) < 0.01) rotationVelocityX = 0.01;
                if (Math.abs(rotationVelocityY) < 0.01) rotationVelocityY = 0.01;
            }

            // 渲染场景：将场景和相机传入渲染器进行渲染
            renderer.render(scene, camera);
        }

        // 启动动画循环
        animate();

        // ============================================
        // 9. 窗口大小自适应
        // ============================================
        // 监听窗口大小变化事件
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            // 更新相机的宽高比
            camera.aspect = window.innerWidth / window.innerHeight;
            // 更新相机的投影矩阵（必须调用，否则视角不会更新）
            camera.updateProjectionMatrix();
            // 更新渲染器的大小
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // 10. 添加鼠标交互效果
        // ============================================

        // 监听鼠标移动事件
        document.addEventListener('mousemove', onDocumentMouseMove, false);
        document.addEventListener('mousedown', onDocumentMouseDown, false);
        document.addEventListener('mouseup', onDocumentMouseUp, false);
        document.addEventListener('mouseleave', onDocumentMouseUp, false);

        function onDocumentMouseMove(event) {
            // 计算鼠标位置（归一化到 -1 到 1 之间）
            targetMouseX = (event.clientX / window.innerWidth) * 2 - 1;
            targetMouseY = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // 如果鼠标按下，实现拖拽旋转效果
            if (isMouseDown) {
                const deltaX = event.clientX - previousMouseX;
                const deltaY = event.clientY - previousMouseY;
                
                // 根据鼠标移动速度增加旋转速度
                rotationVelocityY = deltaX * 0.005;
                rotationVelocityX = deltaY * 0.005;
                
                previousMouseX = event.clientX;
                previousMouseY = event.clientY;
            }
        }

        function onDocumentMouseDown(event) {
            isMouseDown = true;
            previousMouseX = event.clientX;
            previousMouseY = event.clientY;
            // 改变鼠标样式
            document.body.style.cursor = 'grabbing';
        }

        function onDocumentMouseUp() {
            isMouseDown = false;
            document.body.style.cursor = 'default';
            // 恢复自动旋转速度
            rotationVelocityX = 0.01;
            rotationVelocityY = 0.01;
        }

        // 在控制台输出提示信息
        console.log('Three.js 3D 场景已加载完成！');
        console.log('操作说明：');
        console.log('- 立方体会自动旋转');
        console.log('- 移动鼠标：立方体会跟随鼠标位置倾斜和移动');
        console.log('- 按住鼠标拖拽：可以加速旋转立方体');
        console.log('- 调整窗口大小会自动适配');
    </script>
</body>
</html>
